# Sealed Secrets controller (15/11/2026) - giải mã SealedSecret (mã hoá, commit được vào Git repo public) thành Secret.
#   Chỉ controller trong cluster có private key -> người đọc Git không giải mã được.
#   KHOÁ là thứ duy nhất phải giữ NGOÀI Git: dựng cluster mới mà không khôi phục khoá = controller sinh khoá mới
#   = không giải mã được SealedSecret cũ (xem runbook "Dựng lại toàn bộ cluster", bước 5).
# project default: controller cần resource cấp cluster (CRD, ClusterRole) + namespace kube-system - project grab-mini cấm cả 2.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.22.0        # app 0.41.2 - khớp kubeseal CLI
    helm:
      releaseName: sealed-secrets
      valuesObject:
        fullnameOverride: sealed-secrets-controller   # tên kubeseal tìm mặc định (kube-system/sealed-secrets-controller)
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
