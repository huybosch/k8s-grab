# Override riêng cho booking ở PROD (khác với service khác): resources + HPA + PDB minAvailable
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
autoscaling:
  enabled: true
  minReplicas: 3          # Incident 1: 2 Pod -> mất 1 = mất 50% công suất; 3 Pod -> mất 33%
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50
pdb:
  minAvailable: 2
  maxUnavailable: null
