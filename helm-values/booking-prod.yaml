# Override riêng cho booking ở PROD (khác với service khác): resources + HPA + PDB minAvailable
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
autoscaling:
  enabled: true
  minReplicas: 3          # Incident 1: 2 Pod -> mất 1 = mất 50% công suất; 3 Pod -> mất 33%
  maxReplicas: 20          # Incident 3: 10x traffic -> chạm 10 Pod mà CPU vẫn 70-83% (> 50%) - không còn dư địa
  targetCPUUtilizationPercentage: 50
pdb:
  minAvailable: 2
  maxUnavailable: null
# 15/11: canary (Argo Rollouts) - Incident 2: release lỗi tới 100% người dùng trong ~9s, phải có người rollback.
#   3 Pod: setWeight 34 = 1 Pod canary (~1/3 traffic). Analysis nền đo error rate từ step 1 -> lỗi thì tự abort.
rollout:
  enabled: true
  steps:
    - setWeight: 34
    - pause: { duration: 45s }
    - setWeight: 67
    - pause: { duration: 30s }
