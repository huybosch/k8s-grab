# booking-service - giá trị riêng của service (không phụ thuộc môi trường)
app: booking
image:
  repository: booking-service
containerPort: 3003
env:
  VERSION: v2
  BUGGY: "true"   # Incident 2 - release v2 LỖI (lần 2)
# Final Project: booking KHÔNG truy cập DB (chỉ payment ghi DB) -> bỏ envFrom booking-config + booking-secret
#   (least privilege: Pod booking bị chiếm cũng không có password DB; NetworkPolicy cũng không cho vào postgres)
probes:
  enabled: true
terminationGracePeriodSeconds: 30
