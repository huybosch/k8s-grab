# Phase 21 - bảo Prometheus Operator scrape /metrics của 3 service
# (Service phải có port tên "http" + label "monitoring: enabled")
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: grab-mini-apps
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: ["default"]
  selector:
    matchLabels:
      monitoring: enabled
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
