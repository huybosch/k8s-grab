apiVersion: v1
kind: Pod
metadata:
  name: stress-mem
spec:
  restartPolicy: Never
  containers:
    - name: stress
      image: polinux/stress
      resources:
        requests:
          memory: "50Mi"
        limits:
          memory: "100Mi"
      args: ["stress", "--vm", "1", "--vm-bytes", "200M", "--vm-hang", "0", "--timeout", "30s"]
