# Phase 24 - Argo CD cho cluster kind grab-mini
#   helm upgrade --install argocd argo/argo-cd --version 10.16.0 -n argocd --create-namespace -f k8s/argocd/values.yaml
# Bản tối giản cho lab: 1 replica mỗi thành phần, không Dex (chỉ user admin), không notifications.
global:
  domain: argocd.localhost

configs:
  params:
    server.insecure: true            # UI qua port-forward HTTP, không cần TLS trong lab
    # So sánh Git vs cluster bằng server-side dry-run (giống kubectl diff): API server tự điền default
    # (vd. volumeClaimTemplates của StatefulSet) -> không báo OutOfSync giả
    controller.diff.server.side: "true"
  cm:
    # Không có webhook GitHub -> cluster (máy cá nhân, không có IP public) nên Argo CD tự POLL Git.
    # Mặc định 180s; để 60s cho lab đỡ chờ. Pipeline còn chủ động "refresh" ngay sau khi push.
    timeout.reconciliation: 60s
    # 15/11: PVC của storage class WaitForFirstConsumer (local-path) ở Pending tới khi có Pod đầu tiên dùng.
    #   PVC pg-backup chỉ có Pod dùng lúc CronJob chạy (19:00 UTC) -> health mặc định "Progressing" làm sync kẹt
    #   ("waiting for healthy state of PVC/pg-backup") -> hook PostSync db-init KHÔNG chạy (cluster mới: thiếu role payment).
    #   Chỉ PVC có annotation grab-mini/healthy-when-pending="true" mới coi Pending = Healthy; PVC khác giữ nguyên mặc định.
    resource.customizations.health.PersistentVolumeClaim: |
      hs = { status = "Progressing", message = "Waiting for PVC to be bound" }
      if obj.status ~= nil and obj.status.phase ~= nil then
        if obj.status.phase == "Bound" then
          hs.status = "Healthy"; hs.message = "PVC is bound"
        elseif obj.status.phase == "Lost" then
          hs.status = "Degraded"; hs.message = "PVC is lost"
        elseif obj.status.phase == "Pending" and obj.metadata.annotations ~= nil
            and obj.metadata.annotations["grab-mini/healthy-when-pending"] == "true" then
          hs.status = "Healthy"; hs.message = "Pending until first consumer (WaitForFirstConsumer)"
        end
      end
      return hs

dex:
  enabled: false
notifications:
  enabled: false

controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
server:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
applicationSet:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
redis:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
