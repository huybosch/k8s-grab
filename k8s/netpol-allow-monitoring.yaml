# Phase 21 - default-deny (Phase 20) chặn cả Prometheus -> mở cho Prometheus scrape /metrics
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["user", "booking", "payment"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 3003
        - protocol: TCP
          port: 3004
