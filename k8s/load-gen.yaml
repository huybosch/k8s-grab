apiVersion: v1
kind: Pod
metadata:
  name: load-gen
spec:
  restartPolicy: Never
  containers:
    - name: load-gen
      image: curlimages/curl
      command: ["/bin/sh", "-c"]
      args:
        - |
          for i in $(seq 1 40); do
            (while true; do
              curl -s -X POST -H "Content-Type: application/json" \
                -d '{"from":"A","to":"B"}' \
                http://booking-service/booking -o /dev/null
            done) &
          done
          sleep 300
