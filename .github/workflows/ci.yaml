# Phase 23-24 - CI trên GitHub Actions: CHỈ test + build (kiểm tra), KHÔNG push image, KHÔNG deploy
#
#   push main / pull_request ──► changes (service nào đổi?) ──► check (matrix: npm test -> docker build)
#
# CD nằm ở chỗ khác (GitOps, Phase 24):
#   ci/pipeline.ps1 (máy local) : test -> build -> push localhost:5001 -> commit helm-values/<svc>-image.yaml -> git push
#   Argo CD (trong cluster)     : thấy commit mới -> sync vào cluster
# Vì sao GitHub không push image: cluster kind chỉ kéo được từ registry local; image trên GHCR mặc định private
# -> nếu CI commit tag ghcr.io/... thì Argo CD sync xong Pod sẽ ImagePullBackOff.
# Trên cluster thật (EKS...): thêm bước push registry chung (GHCR/ECR) + commit tag ở đây, bỏ pipeline local.
name: ci

on:
  push:
    branches: [main]
    paths: ["booking-service/**", "payment-service/**", "user-service/**", ".github/workflows/ci.yaml"]
  pull_request:
    paths: ["booking-service/**", "payment-service/**", "user-service/**", ".github/workflows/ci.yaml"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # chỉ là kiểm tra -> commit mới huỷ lần chạy cũ

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}   # vd. ["booking","user"]
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            booking: [booking-service/**, .github/workflows/ci.yaml]
            payment: [payment-service/**, .github/workflows/ci.yaml]
            user: [user-service/**, .github/workflows/ci.yaml]

  check:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}-service/package-lock.json

      - name: test
        working-directory: ${{ matrix.service }}-service
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: build (không push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}-service
          push: false
          tags: ${{ matrix.service }}-service:${{ github.sha }}
