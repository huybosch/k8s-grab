# Phase 23 - bản GitHub Actions của ci/pipeline.ps1 (CHƯA chạy - repo chưa có trên GitHub)
#
#   push main ──► changes (service nào đổi?) ──► build (matrix: test -> build -> push GHCR) ──► record (commit tag)
#   pull_request ──► chỉ test + build, KHÔNG push, KHÔNG record
#
# Khác với bản local:
#   - registry = ghcr.io/<owner>, đăng nhập bằng GITHUB_TOKEN có sẵn
#   - KHÔNG deploy: runner của GitHub không vào được cluster kind trên máy cá nhân. CI chỉ commit
#     helm-values/<svc>-image.yaml -> Argo CD (Phase 24) thấy commit và tự sync vào cluster (GitOps).
#     Muốn CD trực tiếp: dùng self-hosted runner trên máy có kubectl/helm trỏ tới cluster.
name: ci

on:
  push:
    branches: [main]
    paths: ["booking-service/**", "payment-service/**", "user-service/**"]
  pull_request:
    paths: ["booking-service/**", "payment-service/**", "user-service/**"]

permissions:
  contents: write     # job record commit lại helm-values
  packages: write     # push image lên GHCR

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false   # không huỷ giữa chừng 1 lần deploy đang chạy

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}   # vd. ["booking","user"]
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            booking: booking-service/**
            payment: payment-service/**
            user: user-service/**

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # cần lịch sử để tính tag = commit cuối động vào thư mục service (giống bản local)

      - id: meta
        run: |
          sha=$(git log -1 --format=%h --abbrev=12 -- "${{ matrix.service }}-service")
          echo "tag=$sha" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.service }}-service" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}-service/package-lock.json

      - name: test
        working-directory: ${{ matrix.service }}-service
        run: |
          npm ci --no-audit --no-fund
          npm test

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build (+ push nếu là push lên main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}-service
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ steps.meta.outputs.tag }}

  record:
    # 1 job duy nhất commit cho mọi service -> tránh nhiều job matrix push đè nhau
    needs: [changes, build]
    if: github.event_name == 'push' && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ghi tag vào helm-values/<svc>-image.yaml
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for svc in $(echo '${{ needs.changes.outputs.services }}' | jq -r '.[]'); do
            sha=$(git log -1 --format=%h --abbrev=12 -- "$svc-service")
            printf '# TẠO BỞI CI - KHÔNG sửa tay. Image đang chạy ở prod cho %s.\nimage:\n  repository: ghcr.io/%s/%s-service\n  tag: "%s"\n' \
              "$svc" "$owner" "$svc" "$sha" > "helm-values/$svc-image.yaml"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm-values/*-image.yaml
          git diff --cached --quiet || git commit -m "deploy: $(echo '${{ needs.changes.outputs.services }}' | jq -r 'join(",")') [skip ci]"
          git push
