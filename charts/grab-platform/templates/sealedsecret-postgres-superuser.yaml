{{- if .Values.sealedSecrets.enabled }}
# Sealed Secrets (15/11/2026) - Secret postgres-superuser ở dạng MÃ HOÁ, commit được vào repo public.
#   Chỉ controller kube-system/sealed-secrets-controller (có private key) giải mã được -> tạo Secret postgres-superuser.
#   Chỉ mã hoá cho đúng namespace default + tên này (scope strict): copy sang namespace khác sẽ không giải mã được.
# Tạo lại (vd. đổi password):
#   kubectl create secret generic postgres-superuser ... --dry-run=client -o json | kubeseal --format yaml > (file này, rồi thêm lại phần header)
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-superuser
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # Secret có TRƯỚC postgres / db-init / payment
  labels:
    {{- include "grab-platform.labels" . | nindent 4 }}
spec:
  encryptedData:
    POSTGRES_PASSWORD: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/managed: "true"
      name: postgres-superuser
      namespace: default
    type: Opaque
{{- end }}
