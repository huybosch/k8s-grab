{{- if .Values.networkPolicies.enabled }}
{{- $np := .Values.networkPolicies }}
# Phase 20 - chặn MỌI ingress traffic vào MỌI Pod trong namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "grab-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Phase 20 - ingress-nginx controller -> các app public (có route Ingress)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx-to-apps
  labels:
    {{- include "grab-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: {{ toJson $np.public }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressControllerNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
      ports:
        {{- range $np.public }}
        - protocol: TCP
          port: {{ required (printf "networkPolicies.appPorts thiếu %s" .) (index $np.appPorts .) }}
        {{- end }}
---
# Phase 21 - Prometheus (namespace monitoring) scrape /metrics của MỌI app
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  labels:
    {{- include "grab-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: {{ toJson (keys $np.appPorts | sortAlpha) }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        {{- range $app := keys $np.appPorts | sortAlpha }}
        - protocol: TCP
          port: {{ index $np.appPorts $app }}
        {{- end }}
{{- range $np.allow }}
---
# Luồng nội bộ: {{ join ", " .from }} -> {{ .to }}:{{ .port }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ join "-" .from }}-to-{{ .to }}
  labels:
    {{- include "grab-platform.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ .to }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .from }}
        - podSelector:
            matchLabels:
              app: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .port }}
{{- end }}
{{- end }}
