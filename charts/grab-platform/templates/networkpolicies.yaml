{{- if .Values.networkPolicies.enabled }}
{{- $np := .Values.networkPolicies }}
# Phase 20 - chặn MỌI ingress traffic vào MỌI Pod trong namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "grab-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Phase 20 - ingress-nginx controller -> các app public (có route Ingress)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx-to-apps
  labels:
    {{- include "grab-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: {{ toJson $np.public }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressControllerNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
      ports:
        {{- range $np.public }}
        - protocol: TCP
          port: {{ required (printf "networkPolicies.appPorts thiếu %s" .) (index $np.appPorts .) }}
        {{- end }}
---
# Phase 21 - Prometheus (namespace monitoring) scrape /metrics của MỌI app
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  labels:
    {{- include "grab-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: {{ toJson (keys $np.appPorts | sortAlpha) }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        {{- range $app := keys $np.appPorts | sortAlpha }}
        - protocol: TCP
          port: {{ index $np.appPorts $app }}
        {{- end }}
{{- range $np.allow }}
---
# Luồng nội bộ: {{ join ", " .from }} -> {{ .to }}:{{ .port }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ join "-" .from }}-to-{{ .to }}
  labels:
    {{- include "grab-platform.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ .to }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .from }}
        - podSelector:
            matchLabels:
              app: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .port }}
{{- end }}
{{- if $np.egress.enabled }}
{{- range $app := keys $np.appPorts | sortAlpha }}
---
# Incident 7 - EGRESS: Pod {{ $app }} bị chiếm quyền cũng chỉ đi được tới DNS + đúng các đích trong "allow"
# (không Internet, không Kubernetes API, không namespace khác). Sinh từ CÙNG danh sách allow với chiều ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-{{ $app }}
  labels:
    {{- include "grab-platform.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ $app }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- range $np.allow }}
    {{- if has $app .from }}
    - to:
        - podSelector:
            matchLabels:
              app: {{ .to }}
      ports:
        - protocol: TCP
          port: {{ .port }}    # port CONTAINER (sau DNAT của Service), không phải port 80 của Service
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
