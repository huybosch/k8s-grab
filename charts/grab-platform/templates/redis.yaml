{{- if .Values.redis.enabled }}
# Final Project - Redis cho user-service. Là CACHE: không lưu đĩa, mất Pod = mất counter (chấp nhận được).
# Deployment (không phải StatefulSet) vì không có dữ liệu cần giữ; strategy Recreate - 1 replica, không cần 2 bản chạy song song.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "grab-platform.labels" . | nindent 4 }}
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "grab-platform.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "{{ .Values.redis.maxmemory }}", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
{{- end }}
