{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "grab-platform.labels" . | nindent 4 }}
spec:
  clusterIP: None      # headless Service, cần cho StatefulSet
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "grab-platform.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      # CHỈ "app: postgres" - thêm label ở đây = đổi pod template = postgres-0 bị restart
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            # password superuser lấy từ Secret tạo tay (ngoài Git). Trước 13/11/2026 nằm thẳng trong values.yaml
            # của repo PUBLIC -> đã đổi password (ALTER USER), giá trị cũ trong lịch sử Git không còn dùng được.
            # Lưu ý: biến này CHỈ có tác dụng lúc initdb (volume trống); đổi Secret KHÔNG đổi password của DB đang chạy.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ required "postgres.passwordSecret là bắt buộc" .Values.postgres.passwordSecret }}, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            # subdir avoids initdb "directory not empty" if the volume root has lost+found
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # volumeClaimTemplates là field BẤT BIẾN của StatefulSet - không thêm label/annotation vào đây
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
