# grab-platform - mặc định = đúng cấu hình PROD đang chạy (namespace default)
#   prod: helm upgrade --install grab-platform charts/grab-platform
#   dev : helm upgrade --install grab-platform charts/grab-platform -n grab-dev -f helm-values/platform-dev.yaml
# Secret KHÔNG nằm trong chart (không commit password vào Git) - tạo tay trong mỗi namespace:
#   kubectl create secret generic booking-secret -n <ns> --from-literal=DB_USERNAME=... --from-literal=DB_PASSWORD=...
#   kubectl create secret generic payment-db     -n <ns> --from-literal=DB_USERNAME=payment --from-literal=DB_PASSWORD=<random>

bookingConfig:
  name: booking-config
  data:
    DB_HOST: "postgres"
    DB_PORT: "5432"
    DB_NAME: "grabmini"

ingress:
  enabled: true
  name: grab-mini-ingress
  className: nginx
  host: ""                 # "" = mọi host (prod). Dev dùng host riêng để không đụng route của prod
  # Incident 4: node chết -> SYN tới Pod trên node đó rơi mất -> mặc định nginx treo tới proxy-connect-timeout 5s rồi 504/timeout.
  # 1s + thử Pod khác: request CHƯA được gửi (mới đang kết nối) nên retry an toàn cả với POST.
  # (đã gửi rồi mà mất kết nối -> nginx KHÔNG retry POST - non_idempotent không bật, đúng ý: tránh trừ tiền 2 lần)
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "1"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
  routes:
    - path: /users
      service: user-service
    - path: /booking
      service: booking-service
    # pathType Prefix khớp theo TỪNG ĐOẠN path: /payment khớp /payment, /payment/x - KHÔNG khớp /payments
    - path: /payment
      service: payment-service
    - path: /payments         # /payments/stats
      service: payment-service
    - path: /drivers
      service: driver-service

# Phase 20 + 21 + Final Project - zero-trust: default-deny + chỉ mở đúng các luồng trong sơ đồ
networkPolicies:
  enabled: true
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring
  appPorts:                # label app -> containerPort (port trong NetworkPolicy là port CONTAINER, không phải port Service)
    user: 3001
    driver: 3002
    booking: 3003
    payment: 3004
    notification: 3005
  public: [user, booking, payment, driver]   # có route Ingress -> ingress-nginx vào được. notification: chỉ nội bộ
  allow:                   # mỗi dòng -> 1 NetworkPolicy "allow-<from>-to-<to>"
    - { to: payment, from: [booking], port: 3004 }
    - { to: notification, from: [booking, driver], port: 3005 }
    - { to: postgres, from: [payment, db-init], port: 5432 }   # booking KHÔNG còn vào DB (không dùng)
    - { to: redis, from: [user], port: 6379 }
  # Incident 7: chiều EGRESS cho mọi app trong appPorts, sinh từ danh sách allow ở trên (+ DNS)
  egress:
    enabled: true

settlement:
  enabled: true
  name: settlement-job
  schedule: "0 0 * * *"
  image: booking-service:v1

postgres:
  enabled: true
  image: postgres:16-alpine
  database: grabmini
  password: change-me      # CHỈ cho lab - production dùng Secret / External Secrets
  storage: 1Gi

# Final Project - Job tạo user DB "payment" + bảng payments (xem templates/db-init.yaml)
dbInit:
  enabled: true
  secretName: payment-db

# Final Project - cache cho user-service
redis:
  enabled: true
  image: redis:7.4-alpine
  maxmemory: 64mb
