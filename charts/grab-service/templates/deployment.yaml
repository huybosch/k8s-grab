apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app }}
  labels:
    {{- include "grab-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "grab-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "grab-service.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/name: {{ .Values.app }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # Incident 7: không service nào gọi Kubernetes API -> không mount token (Pod bị chiếm cũng không có credential cluster)
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              {{- include "grab-service.selectorLabels" . | nindent 14 }}
          # Final Project: chỉ đếm Pod CÙNG ReplicaSet (cùng revision). Không có dòng này, lúc rolling update Pod CŨ
          # (cùng label app) vẫn được tính -> Pod mới dồn sang node còn ít Pod cũ, Pod cũ xoá xong thì lệch hết về 1 node
          matchLabelKeys: ["pod-template-hash"]
      {{- end }}
      {{- with .Values.nodeFailureTolerationSeconds }}
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: {{ . }}
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: {{ . }}
      {{- end }}
      {{- if .Values.preferredAntiAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "grab-service.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: {{ .Values.app }}
          image: "{{ required "values.image.repository là bắt buộc" .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
          {{- with .Values.env }}
          env:
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if gt (int .Values.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.preStopSleepSeconds }}"]
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.containerPort }}
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.containerPort }}
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          {{- end }}
